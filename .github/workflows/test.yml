name: CI / Tests and Checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-and-proto:
    name: Upstream Checks / Format and Proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
      - name: Check proto version headers
        shell: bash
        run: |
          head -n 4 core/config.pb.go > ref.txt
          find . -name "*.pb.go" ! -name "*_grpc.pb.go" -print0 | while IFS= read -r -d '' file; do
            if ! cmp -s ref.txt <(head -n 4 "$file"); then
              echo "Error: Header mismatch in $file"
              head -n 4 "$file"
              exit 1
            fi
          done

  upstream-tests:
    name: Upstream Tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
          enableCrossOsArchive: true
      - name: Restore and verify geodat
        shell: pwsh
        run: ./.github/build/prepare-assets.ps1
      - name: Test
        run: go test -timeout 1h -v ./...

  fork-regression-tests:
    name: Fork Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
      - name: Restore and verify geodat
        shell: pwsh
        run: ./.github/build/prepare-assets.ps1
      - name: Repeat observation and concurrency packages
        run: >-
          go test -timeout 1h -count=2
          ./app/dispatcher ./proxy/socks ./features/routing ./common/mux
      - name: Test fork transport and external-owner packages
        run: >-
          go test -timeout 1h -count=1
          ./app/proxyman/inbound ./app/proxyman/outbound ./core
          ./proxy/tun ./proxy/wireguard ./proxy/vless/inbound ./proxy/dokodemo ./proxy/hysteria
          ./transport/internet/...

  race-tests:
    name: Race Tests / Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
      - name: Restore and verify geodat
        shell: pwsh
        run: ./.github/build/prepare-assets.ps1
      - name: Race test
        run: go test -race -timeout 1h ./...
