name: CI / Tests and Checks

on:
  push:
    branches: [codex/xray-unified]
  pull_request:
    branches: [codex/xray-unified]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-proto:
    if: github.repository == 'svlavr/Xray-core'
    name: Upstream Checks / Format and Proto
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
      - name: Check proto version headers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          head -n 4 core/config.pb.go > ref.txt
          find . -name "*.pb.go" ! -name "*_grpc.pb.go" -print0 | while IFS= read -r -d '' file; do
            if ! cmp -s ref.txt <(head -n 4 "$file"); then
              echo "Error: Header mismatch in $file"
              head -n 4 "$file"
              exit 1
            fi
          done
      - name: Verify modules
        if: ${{ !cancelled() }}
        run: |
          go mod verify

  upstream-tests:
    if: github.repository == 'svlavr/Xray-core'
    name: Upstream Tests / ${{ matrix.name }}
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
          enableCrossOsArchive: true
      - name: Restore and verify geodat
        shell: pwsh
        run: ./.github/build/prepare-assets.ps1
      - name: Enable native ICMP for runner group
        if: runner.os == 'Linux'
        shell: bash
        run: sudo sysctl -w "net.ipv4.ping_group_range=$(id -g) $(id -g)"
      - name: Vet Measurement and VMess
        run: go vet -mod=readonly ./measurement ./proxy/vmess/...
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -timeout 1h -v ./... 2>&1 | tee "$RUNNER_TEMP/measurement-profiles.log"
      - name: Require all Measurement profile cells
        if: ${{ !cancelled() }}
        shell: bash
        run: python .github/ci/check_measurement_coverage.py "$RUNNER_TEMP/measurement-profiles.log"
      - name: Darwin UDP ownership and dual-stack regressions
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: go test -mod=readonly -race -timeout 10m -count=2 -run '^TestSystemUDP' ./transport/internet

  race-tests:
    if: github.repository == 'svlavr/Xray-core'
    name: Race Tests / Linux
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
      - name: Restore and verify geodat
        shell: pwsh
        run: ./.github/build/prepare-assets.ps1
      - name: Enable native ICMP for runner group
        if: runner.os == 'Linux'
        shell: bash
        run: sudo sysctl -w "net.ipv4.ping_group_range=$(id -g) $(id -g)"
      - name: Race test
        run: go test -mod=readonly -race -timeout 1h ./...

  fork-regression-tests:
    if: github.repository == 'svlavr/Xray-core'
    timeout-minutes: 90
    name: Fork Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-
      - name: Restore and verify geodat
        shell: pwsh
        run: ./.github/build/prepare-assets.ps1
      - name: Enable native ICMP for runner group
        if: runner.os == 'Linux'
        shell: bash
        run: sudo sysctl -w "net.ipv4.ping_group_range=$(id -g) $(id -g)"
      - name: Repeat control, statistics and DNS ownership regressions
        run: >-
          go test -mod=readonly -race -timeout 1h -count=2
          -run '^(TestInspection|TestObservationCapture|TestObserve|TestVision|TestFlowInspection|TestControlStats|TestCleanControlStats|TestStageB|TestDNSPreparation|TestDNSApply|TestFeatureResolution|TestSystemDNS|TestOwnedPeriodic|TestCacheClose|TestTrackedTCPAndDoH|TestTCPAndDoH|TestQUICResource|TestQUICCanceled|TestQUICResolution|TestDoHResource|TestToDNSContext)'
          ./app/stats ./app/dns ./core ./proxy ./proxy/blackhole ./proxy/dns ./testing/scenarios
      - name: Test shared transport and endpoint mechanisms
        if: ${{ !cancelled() }}
        run: >-
          go test -mod=readonly -race -timeout 1h -count=1
          ./common/buf ./common/crypto ./common/mux ./common/session
          ./features/dns/... ./features/routing/... ./app/proxyman/inbound
          ./proxy/shadowsocks_2022 ./transport/pipe ./transport/internet ./transport/internet/udp
      - name: Test legacy HTTP2 pool ownership
        if: ${{ !cancelled() }}
        env:
          GODEBUG: http2legacy=1
        run: >-
          go test -mod=readonly -race -timeout 1h -count=2
          -run '^TestStageBDoHPooledSiblingCancellation$'
          ./app/dns
      - name: Smoke test API, packet accounting and capture benchmarks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          go test -mod=readonly ./app/stats ./core -run '^$' \
            -bench '^(BenchmarkControlStatsP5TCPExchange|BenchmarkInspectionPacketInput|BenchmarkInspectionCapturePacketInput)$' \
            -benchtime=100x -count=1 -timeout=2m 2>&1 | tee "$RUNNER_TEMP/control-stats-bench.log"
          if grep -q -- '--- FAIL:' "$RUNNER_TEMP/control-stats-bench.log"; then
            exit 1
          fi
      - name: Native TLS certificate and inspection ownership races
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -race -timeout 5m -count=2 ./transport/internet/tls
      - name: Native outbound cache functionality
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -timeout 2m -count=1 -run '^TestTagsCache$' ./app/proxyman/outbound
      - name: Same-key cached DNS cancellation regressions
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -race -timeout 5m -count=20 -run '^TestCachedFetch' ./app/dns
      - name: Reconciled native Measurement prerequisite regressions
        if: ${{ !cancelled() }}
        run: >-
          go test -mod=readonly -race -timeout 15m -count=2
          -run '^(TestMeasurement|TestTrojanPacket|TestGRPC|TestResponseCommand|TestXHTTPManager|TestMaxConnections|TestCMaxReuseTimes|TestMaxConcurrency|TestDefault$|TestSystemUDP)'
          ./common/mux ./proxy ./proxy/hysteria ./proxy/shadowsocks_2022 ./proxy/trojan
          ./proxy/vmess/encoding ./transport/internet ./transport/internet/grpc/...
          ./transport/internet/hysteria ./transport/internet/websocket ./transport/internet/splithttp
      - name: Complete Measurement operation and profile races
        if: ${{ !cancelled() }}
        run: >-
          go test -mod=readonly -race -timeout 1h -count=1
          ./measurement ./proxy/hysteria ./transport/internet/hysteria ./transport/internet/tls
      - name: Complete native Measurement companion races
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -race -timeout 1h -count=1 -p 1 -run '^TestMeasurement' ./transport/internet/websocket ./common/mux ./transport/internet/grpc/encoding ./proxy
          go test -mod=readonly -race -timeout 1h -count=1 -p 1 -run '^TestMeasurementPacket' ./proxy/trojan ./proxy/shadowsocks_2022
          go test -mod=readonly -race -timeout 3m -count=1 -run '^TestSystemUDP' ./transport/internet
          go test -mod=readonly -race -timeout 10m -count=2 -run '^(TestGRPCMultiMode|TestMultiHunk|TestMeasurementInheritedObservation)' ./transport/internet/grpc/... ./measurement
