name: Linux race check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Restore geodata
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: |
          go test \
            -mod=readonly \
            -race \
            -count=1 \
            -timeout=10m \
            ./common/mux/... \
            ./app/proxyman/outbound \
            ./core \
            ./transport/internet/splithttp
